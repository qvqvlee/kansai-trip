<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kansai Notebook — 채림언니랑 간사이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --desk:#e9e6e1;--paper:#fbfaf7;--paper2:#f3f1ec;--ink:#1d1c1a;--ink2:#6f6b65;--rule:#d9d5ce;--rule2:#ece9e3;
  --mark:rgba(240,206,92,.75);--hot:#b3263c;--gold:#8c7a5b;--good:#4f7d5c;--warn:#b26a26;--sky:#4b6b8a;--water:#e4e9ec;
  --f-title:"Jost","Gowun Dodum",system-ui,sans-serif;--f-label:"Jost",system-ui,sans-serif;
  --f-word:"Cormorant Garamond",Georgia,serif;--f-ko:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  --shadow:0 30px 60px -30px rgba(40,30,20,.35),0 2px 6px rgba(40,30,20,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ko);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
mark{background:linear-gradient(transparent 50%,var(--mark) 50%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px}
.lbl{font-family:var(--f-label);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.book{max-width:1080px;margin:0 auto;background:var(--paper);border-radius:22px 8px 8px 22px;box-shadow:var(--shadow);overflow:clip}
.bhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;padding:22px 30px 14px;border-bottom:1.5px solid var(--ink)}
.logo{margin:0;font-family:var(--f-word);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.logo i{font-weight:500;color:var(--hot)}
.sub{margin-top:6px;font-family:var(--f-label);font-size:12px;letter-spacing:.14em;color:var(--ink2)}
.sync{font-family:var(--f-label);font-size:11px;letter-spacing:.06em;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.sync.on .d{background:var(--good)} .sync.off .d{background:var(--warn)}
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 22px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;padding:13px 12px 11px;font-family:var(--f-label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);border-bottom:2px solid transparent}
nav.tabs a span{font-family:var(--f-ko);letter-spacing:0;text-transform:none;font-size:13px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--hot)}
main{padding:8px 30px 40px}
section.view{display:none;animation:fade .45s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:18px 0 8px;border-bottom:1.5px solid var(--ink);margin-bottom:16px}
.ph h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:26px;line-height:1.1}
.ph h2 small{margin-left:8px;font-weight:300;font-size:14px;color:var(--ink2)}
.note{margin:10px 0;font-size:13px;color:var(--ink2);padding:8px 12px;border-left:2px solid var(--gold);background:var(--paper2)}
.note.warn{border-left-color:var(--warn);color:#6b4a26}
.chip{display:inline-block;padding:1px 9px;border:1px solid var(--ink);border-radius:999px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.06em;white-space:nowrap}
.chip.soft{border-color:var(--rule);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--ink);background:none;border-radius:999px;font-size:12.5px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--paper2)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.sm{padding:2px 9px;font-size:11.5px}
.btn.ghost{border-color:var(--rule);color:var(--ink2)}
.cat{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;transform:translateY(-1px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* timeline */
.week{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.dcol .num{font-family:var(--f-title);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.dcol .num small{font-size:15px;font-weight:400;color:var(--ink2)}
.dcol .wd{font-family:var(--f-label);font-size:11px;letter-spacing:.2em;color:var(--hot);margin-top:4px}
.day{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--rule)}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:8px}
.dhead h3{margin:0;font-family:var(--f-title);font-size:19px;font-weight:600}
.sleep{font-size:12px;color:var(--ink2)}
.sleep b{color:var(--ink);font-weight:400;background:linear-gradient(transparent 55%,var(--mark) 55%)}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.stops li{position:relative;display:grid;grid-template-columns:44px 1fr;gap:16px;padding:7px 0}
.stops li::before{content:"";position:absolute;left:49px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.stops li.mv::before{border-color:var(--sky);background:var(--sky)}
.stops li.todo::before{border-style:dashed;border-color:var(--ink2)}
.stops .t{font-family:var(--f-label);font-size:11px;letter-spacing:.04em;color:var(--ink2);text-align:right;padding-top:2px;white-space:nowrap}
.stops .n{font-size:15px}
.stops .x{font-size:12.5px;color:var(--ink2);margin-top:1px}
.stops .c{font-family:var(--f-label);font-size:11.5px;color:var(--good);margin-left:6px;white-space:nowrap}
.stops .ln{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.mission{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* map */
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 14px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.gmap{width:100%;height:min(62vh,520px);border:1px solid var(--rule);border-radius:6px;margin:6px 0 4px;background:var(--paper2)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start;margin:6px 0 10px}
.dgrid .gmap{margin:0;height:min(64vh,540px)}
.legs{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:12px 14px}
.legs h4{margin:0 0 6px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.18em;color:var(--ink2);font-weight:400}
.leg{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.leg .i{font-size:15px;line-height:1.4}
.leg .r{font-size:13.5px}
.leg .m{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-family:var(--f-label);font-size:11.5px;color:var(--ink2)}
.leg .m b{font-weight:500;color:var(--ink)}
.leg .m .y{color:var(--good)}
.legs .sum{margin-top:8px;padding-top:8px;border-top:1.5px solid var(--ink);display:flex;justify-content:space-between;font-family:var(--f-label);font-size:12px}
.memos{margin-top:18px}
.memo{border:1px solid var(--rule);border-radius:6px;background:var(--paper);margin-bottom:8px}
.memo>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px}
.memo>summary::-webkit-details-marker{display:none}
.memo>summary::before{content:"▸";color:var(--ink2);transition:transform .2s;font-size:12px}
.memo[open]>summary::before{transform:rotate(90deg)}
.memo>summary .em{font-size:18px}
.memo>summary .tg{margin-left:auto}
.memo .body{padding:2px 16px 14px 38px}
.props{display:grid;grid-template-columns:86px 1fr;gap:5px 12px;font-size:13px;margin:4px 0 10px}
.props dt{color:var(--ink2);font-family:var(--f-label);font-size:11.5px;letter-spacing:.04em;padding-top:1px}
.props dd{margin:0}
.memo .body ul{margin:4px 0;padding-left:18px;font-size:13px}
.memo .co{margin:8px 0 0;padding:8px 12px;background:var(--paper2);border-radius:4px;font-size:13px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}.dgrid .gmap{height:52vh}.memo .body{padding-left:16px}}
.mapwrap{border:1px solid var(--rule);border-radius:6px;background:#f7f5f0;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.pin{cursor:pointer}
.pin:hover circle.dot,.pin.sel circle.dot{r:11}
.pin.sel circle.ring{opacity:1}
.mlabel{font-family:var(--f-ko);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:#f7f5f0;stroke-width:4px;stroke-linejoin:round}
.mlabel.st{font-size:12px;fill:var(--ink2)}
.mlabel.area{font-family:var(--f-word);font-style:italic;font-size:17px;fill:#9aa7ad;stroke:none}
.mdetail{margin-top:12px;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);min-height:70px}
.mdetail h4{margin:0 0 4px;font-size:17px;font-weight:400}
.mdetail p{margin:2px 0;font-size:13px;color:var(--ink2)}

/* cards */
.city{margin-top:26px}
.city>h3{margin:0 0 10px;display:flex;align-items:baseline;gap:10px;font-family:var(--f-word);font-size:26px;font-weight:700}
.city>h3 small{font-family:var(--f-label);font-size:11px;letter-spacing:.18em;color:var(--ink2);font-weight:400;text-transform:uppercase}
.card{position:relative;border:1px solid var(--rule);border-radius:6px;padding:14px 16px 12px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.card.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card h4{margin:0;font-size:16.5px;font-weight:400;line-height:1.35}
.card .jp{font-family:var(--f-word);font-size:15px;color:var(--ink2)}
.card ul{margin:2px 0 0;padding-left:16px;font-size:13px;color:var(--ink2)}
.card ul li{margin:2px 0}
.card .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:6px}
.price{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.price input{width:96px;padding:3px 6px;border:0;border-bottom:1px solid var(--ink);background:transparent;font-family:var(--f-label);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.price input:focus{outline:none;background:var(--paper2)}
.ref{font-family:var(--f-label);font-size:12px;color:var(--good)}
.del{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--ink2);font-size:15px;line-height:1}
.empty{border:1px dashed var(--rule);border-radius:6px;padding:16px;color:var(--ink2);font-size:13px;background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.015) 8px 16px)}
details.add{margin-top:12px}
details.add summary{cursor:pointer;font-size:13px;color:var(--ink2);list-style:none}
details.add summary::before{content:"＋ "}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px;padding:12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2)}
.form input,.form select{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.pick{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer}
.pick input{accent-color:var(--ink)}

/* shopping */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule2)}
.list label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.list input[type=checkbox]{appearance:none;flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);margin:0;display:grid;place-items:center}
.list input[type=checkbox]:checked{background:var(--ink)}
.list input[type=checkbox]:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper)}
.list .nm{min-width:0}
.list .nm small{display:block;font-family:var(--f-label);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.list li.done .nm>span{text-decoration:line-through;color:var(--ink2)}
.list .yen{font-family:var(--f-label);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}

/* budget */
table.bud{width:100%;border-collapse:collapse;font-size:13.5px}
.bud th{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:400;text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--ink)}
.bud th:first-child{text-align:left}
.bud td{padding:7px 6px;border-bottom:1px solid var(--rule2);text-align:right;font-family:var(--f-label);font-variant-numeric:tabular-nums;vertical-align:middle}
.bud td:first-child{text-align:left;font-family:var(--f-ko)}
.bud td small{display:block;color:var(--ink2);font-size:11.5px;font-family:var(--f-ko)}
.bud input{width:84px;padding:3px 5px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:right;font-family:var(--f-label);font-variant-numeric:tabular-nums}
.bud input.q{width:40px}
.bud input:focus{outline:none;border-bottom-color:var(--ink);background:var(--paper2)}
.bud tr.grp td{padding-top:16px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase;border-bottom:1px solid var(--rule)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0 6px}
.tot div{border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.tot b{display:block;font-family:var(--f-title);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tot div.main{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tot div.main .lbl{color:#bdb8b0}
.rate{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.rate input{width:64px;padding:3px 5px;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:right;font-family:var(--f-label)}
footer{padding:16px 30px 24px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;transition:.3s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){
  body{padding-left:0;padding-right:0;padding-top:0}
  .book{border-radius:0}
  .bhead{padding:18px 18px 12px}.logo{font-size:28px}
  nav.tabs{padding:0 8px} nav.tabs a{padding:12px 9px 10px;letter-spacing:.1em}
  
  main{padding:4px 16px 30px}
  .day,.week{grid-template-columns:1fr;gap:6px}
  .dcol{display:flex;align-items:baseline;gap:10px}
  .dcol .num{font-size:28px}
  .stops::before{left:44px}.stops li{grid-template-columns:38px 1fr;gap:14px}.stops li::before{left:41px}
  .bud input{width:70px}.bud input.q{width:32px}
  .bud th:nth-child(3),.bud td:nth-child(3){display:none}
  footer{padding:14px 16px 22px}
}
</style>
</head>
<body>
<div class="book">
  <header class="bhead">
    <div>
      <h1 class="logo">Kansai <i>Notebook</i></h1>
      <div class="sub">채림언니랑 간사이 · 2027. 1. 11 — 1. 21</div>
    </div>
    <div class="sync" id="sync" style="display:none"><span class="d"></span><span id="syncT">연결 중…</span></div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#w"><span>오사카 주간</span></a>
    <a href="#d17"><span>1/17 일</span></a><a href="#d18"><span>1/18 월</span></a><a href="#d19"><span>1/19 화</span></a><a href="#d20"><span>1/20 수</span></a><a href="#d21"><span>1/21 목</span></a>
    <a href="#places"><span>장소</span></a><a href="#stay"><span>숙소</span></a><a href="#shop"><span>쇼핑</span></a><a href="#budget"><span>예산</span></a>
  </nav>
  <main>
    <section class="view" id="v-w"></section><section class="view" id="v-d17"></section><section class="view" id="v-d18"></section><section class="view" id="v-d19"></section><section class="view" id="v-d20"></section><section class="view" id="v-d21"></section>
    <section class="view" id="v-places"></section>
    <section class="view" id="v-stay"></section>
    <section class="view" id="v-shop"></section>
    <section class="view" id="v-budget"></section>
  </main>
  <footer>가격·시간은 2026년 10월 기준 조사값이라 바뀔 수 있어요 (특히 1월 시즌 메뉴·숙박료). 입력한 가격·체크·추가한 장소는 이 기기에만 저장돼요.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>"¥"+Math.round(n).toLocaleString("ko-KR");
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const gm=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const dir=(a,b,mode="transit")=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a)}&destination=${encodeURIComponent(b)}&travelmode=${mode}`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),1600)}

/* ---------- content ---------- */
const CAT={
  cafe:{c:"#b3263c",l:"카페·디저트"}, food:{c:"#d0655a",l:"맛집"}, beauty:{c:"#8c7a5b",l:"헤어"},
  shop:{c:"#4f7d5c",l:"쇼핑"}, sight:{c:"#4b6b8a",l:"구경"}, onsen:{c:"#b26a26",l:"온천"},
  hotel:{c:"#1d1c1a",l:"숙소"}, base:{c:"#8f8a82",l:"멘토링"}
};
const CITIES=[["osaka","Osaka","오사카"],["nara","Nara","나라"],["kyoto","Kyoto","교토"],["arima","Arima","아리마 온천"],["kobe","Kobe","고베"]];

const PLACES=[

/* ---------- shared state ---------- */
let DB=null, VALS={}, ITEMS={}, writable=true;
const LS="kansai-notebook-v1";
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");VALS=o.v||{};ITEMS=o.i||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({v:VALS,i:ITEMS}))}catch(e){}}
const V=(k,d)=>(k in VALS && VALS[k]!==null && VALS[k]!=="")?VALS[k]:d;
const pend={}, busy={};
function setV(k,v){
  VALS[k]=v; refresh();
  if(!DB){saveLocal();return}
  clearTimeout(pend[k]); pend[k]=setTimeout(()=>flush(k),450);
}
async function flush(k){
  if(busy[k]){pend[k]=setTimeout(()=>flush(k),300);return}
  delete pend[k];
  busy[k]=true;
  try{await DB.doc("vals/"+k).set({v:VALS[k]??null,t:Date.now()})}
  catch(e){ if(e&&e.code==="invalid_argument"){writable=false;setSync("off","보기 전용이라 저장 안 돼요")} else toast("저장 실패 — 다시 해볼래?") }
  finally{busy[k]=false}
}
async function addItem(o){
  o.t=Date.now();
  if(DB){try{await DB.collection("items").add(o)}catch(e){toast(e&&e.code==="invalid_argument"?"보기 전용이라 추가 안 돼요":"추가 실패")}}
  else{const id="l"+o.t;ITEMS[id]=o;saveLocal();renderAll()}
}
async function delItem(id){
  if(DB){try{await DB.doc("items/"+id).delete()}catch(e){toast("삭제 실패")}}
  else{delete ITEMS[id];saveLocal();renderAll()}
}
function setSync(cls,t){const s=$("#sync");s.className="sync "+cls;$("#syncT").textContent=t}

  if(!selPin) return `<p>핀을 눌러봐. ${mapView==="k"?"빨간 점선이 1/17 → 1/21 동선이야.":"멘토링 주간에 다닐 오사카 스팟 + 마지막 날 호텔 후보."}</p>`;
  const o=allPins(mapView).find(x=>x.id===selPin);if(!o)return"";const r=o.ref;
  return `<span class="lbl"><i class="cat" style="background:${CAT[o.cat].c}"></i>${CAT[o.cat].l}</span><h4>${esc(r.name)}</h4>${r.jp?`<p>${esc(r.jp)}</p>`:""}${(r.info||[]).slice(0,3).map(t=>`<p>· ${esc(t)}</p>`).join("")}
   <div class="ln" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><a class="btn sm solid" href="${gm(r.q)}" target="_blank" rel="noopener">구글맵 ↗</a><a class="btn sm" href="#${o.stay?"stay":"places"}" data-go="${o.id}">자세히</a></div>`;
}

/* ---------- render: places ---------- */
function custom(kind,group){return Object.entries(ITEMS).filter(([,o])=>o&&o.kind===kind&&o.group===group).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).map(([id,o])=>({id,custom:1,...o}))}
function priceBox(key,label="가격"){return `<label class="price">${label} ¥<input inputmode="numeric" data-k="${key}" placeholder="입력"></label>`}
function placeCard(p){
  const L=(p.links||[]).map(([t,u])=>`<a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("");
  return `<article class="card" id="c-${p.id}">${p.custom?`<button class="del" data-del="${p.id}" title="삭제">×</button>`:""}
   <span class="lbl"><i class="cat" style="background:${(CAT[p.cat]||CAT.sight).c}"></i>${(CAT[p.cat]||CAT.sight).l}</span>
   <h4>${esc(p.name)}</h4>${p.jp?`<div class="jp">${esc(p.jp)}</div>`:""}
   ${p.info&&p.info.length?`<ul>${p.info.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
   ${p.memo?`<ul><li>${esc(p.memo)}</li></ul>`:""}
   <div class="foot">${p.ref?`<span class="ref">참고 ${esc(p.ref)}</span>`:""}${priceBox("pp_"+p.id)}<span style="flex:1"></span>
   <a class="btn sm solid" href="${p.link?esc(p.link):gm(p.q||p.name)}" target="_blank" rel="noopener">${p.link?"링크":"구글맵"} ↗</a>${L}</div></article>`;
}
function addForm(kind,group,ph){
  return `<details class="add"><summary>${ph}</summary><form class="form" data-add="${kind}" data-group="${group}">
   <input name="name" placeholder="이름 (구글맵에 검색될 이름)" required>
   ${kind==="place"?`<select name="cat">${Object.entries(CAT).filter(([k])=>!["hotel","base"].includes(k)).map(([k,o])=>`<option value="${k}">${o.l}</option>`).join("")}</select>`:""}
   <input name="memo" placeholder="메모 (선택)">
   <input name="link" placeholder="링크 (선택)">
   <input name="price" inputmode="numeric" placeholder="${kind==="stay"?"가격 ¥":"가격 ¥ (선택)"}">
   <button class="btn solid" type="submit">추가</button></form></details>`;
}
function renderPlaces(){
  $("#v-places").innerHTML=`<div class="ph"><h2>장소 <small>가고 싶은 곳</small></h2><span class="chip soft">가격 칸은 둘 다 수정 가능</span></div>`+
   CITIES.map(([k,en,ko])=>{const L=[...PLACES.filter(p=>p.city===k),...custom("place",k)];
    return `<div class="city"><h3>${ko} <small>${en}</small></h3><div class="grid2">${L.map(placeCard).join("")||`<div class="empty">아직 없음</div>`}</div>${addForm("place",k,`${ko}에 장소 추가`)}</div>`}).join("");
}

/* ---------- render: stay ---------- */
function stayCard(S,h){
  const picked=V("pick_"+S.g,null)===h.id;
  const L=(h.links||[]).map(([t,u])=>`<a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("");
  return `<article class="card ${picked?"picked":""}" id="c-${h.id}">${h.custom?`<button class="del" data-del="${h.id}" title="삭제">×</button>`:""}
   <h4>${esc(h.name)}</h4>
   ${h.info?`<ul>${h.info.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}${h.memo?`<ul><li>${esc(h.memo)}</li></ul>`:""}
   <div class="foot">${h.ref?`<span class="ref">참고 ${esc(h.ref)}</span>`:""}${priceBox("hp_"+h.id,S.unit)}</div>
   <div class="foot"><label class="pick"><input type="radio" name="pick_${S.g}" data-pick="${S.g}" value="${h.id}" ${picked?"checked":""}> 여기로 할래</label><span style="flex:1"></span>
   <a class="btn sm solid" href="${h.link?esc(h.link):gm(h.q||h.name)}" target="_blank" rel="noopener">${h.link?"링크":"구글맵"} ↗</a>${L}</div></article>`;
}
function renderStay(){
  $("#v-stay").innerHTML=`<div class="ph"><h2>숙소 <small>1/17 – 1/20 · 4박</small></h2><span class="chip soft">‘여기로 할래’ 고르면 예산에 자동 반영</span></div>`+
   STAYS.map(S=>{const L=[...S.list,...custom("stay",S.g)];
    return `<div class="city"><h3>${S.title} <small>${S.when} · ${S.unit} 가격</small></h3>${S.intro?`<p class="note">${esc(S.intro)}</p>`:""}
     <div class="grid2">${L.map(h=>stayCard(S,h)).join("")||`<div class="empty">${esc(S.empty)}</div>`}</div>${addForm("stay",S.g,`${S.title} 후보 추가`)}</div>`}).join("");
}

/* ---------- render: shop ---------- */
function renderShop(){
  $("#v-shop").innerHTML=`<div class="ph"><h2>쇼핑 <small>멘토링 주간 저녁 미션</small></h2></div>
   <div class="city" style="margin-top:6px"><h3>다이소 헬로키티 <small>Daiso</small></h3>
    <p class="note">품번(JAN)으로 검색하거나 직원한테 화면 보여주면 찾기 편해. 번호 누르면 복사돼.</p>
    <ul class="list">${DAISO.map(([id,n,jan,p])=>`<li data-row="${id}"><label><input type="checkbox" data-chk="${id}"><span class="nm"><span>${esc(n)}</span><small>JAN ${jan}</small></span></label>
      <button class="btn sm ghost" data-copy="${jan}">복사</button><span class="yen">${yen(p)}</span></li>`).join("")}
     <li><span style="flex:1" class="lbl">합계 (6개 다 사면)</span><span class="yen"><b>${yen(DAISO.reduce((a,d)=>a+d[3],0))}</b></span></li></ul></div>
   <div class="city"><h3>편의점 미션 <small>Konbini</small></h3><ul class="list">${CONV.map(([id,n,x])=>`<li data-row="${id}"><label><input type="checkbox" data-chk="${id}"><span class="nm"><span>${esc(n)}</span><small>${esc(x)}</small></span></label></li>`).join("")}</ul></div>
   <div class="city"><h3>돈키호테 · 기타 <small>Etc.</small></h3><ul class="list" id="etcList">${custom("buy","etc").map(o=>`<li data-row="${o.id}"><label><input type="checkbox" data-chk="${o.id}"><span class="nm"><span>${esc(o.name)}</span>${o.memo?`<small>${esc(o.memo)}</small>`:""}</span></label><span class="yen">${o.price?yen(o.price):""}</span><button class="del" style="position:static" data-del="${o.id}">×</button></li>`).join("")||`<li style="color:var(--ink2);font-size:13px">사고 싶은 거 추가해줘</li>`}</ul>
    <form class="form" data-add="buy" data-group="etc" style="margin-top:10px"><input name="name" placeholder="살 것" required><input name="memo" placeholder="메모 (어디서·누구 선물 등)"><input name="price" inputmode="numeric" placeholder="가격 ¥ (선택)"><button class="btn solid" type="submit">추가</button></form></div>`;
}

/* ---------- render: budget ---------- */
function stayPick(g){const S=STAYS.find(s=>s.g===g);const id=V("pick_"+g,null);if(!id)return{S,name:null,p:0};const h=[...S.list,...custom("stay",g)].find(x=>x.id===id);const p=+V("hp_"+id,h&&h.price||0)||0;return{S,name:h?h.name:null,p}}
function calc(){
  let total=0;const rows={};
  BUDGET.forEach(([,R])=>R.forEach(r=>{let sub;
    if(r.stay){const {S,p}=stayPick(r.stay);sub=p*S.mult}
    else{const p=+V("bp_"+r.id,r.p??0)||0,q=+V("bq_"+r.id,r.q)||0;sub=p*q}
    rows[r.id]=sub;total+=sub}));
  custom("cost","etc").forEach(o=>{const s=(+V("bp_"+o.id,o.price||0)||0)*(+V("bq_"+o.id,1)||0);rows[o.id]=s;total+=s});
  return{rows,total};
}
function renderBudget(){
  const row=r=>{
    if(r.stay){const {S}=stayPick(r.stay);return `<tr><td>${esc(r.label)}<small data-stayname="${r.stay}"></small></td><td data-stayp="${r.stay}"></td><td>${S.multL}</td><td data-sub="${r.id}"></td></tr>`}
    return `<tr><td>${esc(r.label)}${r.hint?`<small>${esc(r.hint)}</small>`:""}</td><td><input inputmode="numeric" data-k="bp_${r.id}" data-def="${r.p??""}" placeholder="—"></td><td><input class="q" inputmode="numeric" data-k="bq_${r.id}" data-def="${r.q}"></td><td data-sub="${r.id}"></td></tr>`};
  $("#v-budget").innerHTML=`<div class="ph"><h2>예산 <small>1/17 – 1/21 · 둘이 합계</small></h2>
    <div class="rate">환율 100엔 = <input inputmode="decimal" data-k="rate" data-def="850">원</div></div>
   <div class="tot"><div class="main"><span class="lbl">합계 (엔)</span><b id="totY"></b></div><div><span class="lbl">합계 (원)</span><b id="totW"></b></div><div><span class="lbl">1인당 (원)</span><b id="perW"></b></div></div>
   <table class="bud"><thead><tr><th>항목</th><th>단가 ¥</th><th>수량</th><th>소계</th></tr></thead><tbody>
   ${BUDGET.map(([g,R])=>`<tr class="grp"><td colspan="4">${g}</td></tr>${R.map(row).join("")}`).join("")}
   ${custom("cost","etc").length?`<tr class="grp"><td colspan="4">추가 항목</td></tr>`:""}
   ${custom("cost","etc").map(o=>`<tr><td>${esc(o.name)} <button class="del" style="position:static;display:inline" data-del="${o.id}">×</button></td><td><input inputmode="numeric" data-k="bp_${o.id}" data-def="${o.price||""}"></td><td><input class="q" inputmode="numeric" data-k="bq_${o.id}" data-def="1"></td><td data-sub="${o.id}"></td></tr>`).join("")}
   </tbody></table>
   <form class="form" data-add="cost" data-group="etc" style="margin-top:12px"><input name="name" placeholder="항목 추가 (예: 교토 기모노 체험)" required><input name="price" inputmode="numeric" placeholder="단가 ¥"><button class="btn solid" type="submit">추가</button></form>
   <p class="note">멘토링 주간(1/11–16) 오사카 비용은 빼고, 헤어세트·다이소만 넣었어. 빈 칸은 정해지면 채우면 돼. 환율 기본값은 2026년 10월 시세(100엔≈850원).</p>`;
}

/* ---------- refresh dynamic bits ---------- */
function refresh(){
  document.querySelectorAll("input[data-k]").forEach(i=>{if(i===document.activeElement)return;const d=i.dataset.def;const v=V(i.dataset.k,d===undefined||d===""?"":d);i.value=v===""?"":(+v).toLocaleString("en-US",{maximumFractionDigits:2}).replace(/,/g,"")});
  document.querySelectorAll("input[data-chk]").forEach(c=>{const on=!!V("chk_"+c.dataset.chk,false);c.checked=on;c.closest("li")?.classList.toggle("done",on)});
  document.querySelectorAll("[data-stayname]").forEach(el=>{const {name,p}=stayPick(el.dataset.stayname);el.textContent=name||"숙소 탭에서 ‘여기로 할래’ 고르기";const pe=document.querySelector(`[data-stayp="${el.dataset.stayname}"]`);if(pe)pe.textContent=p?yen(p):"—"});
  if($("#totY")){const {rows,total}=calc();const r=(+V("rate",850)||850)/100;
    document.querySelectorAll("[data-sub]").forEach(td=>{const s=rows[td.dataset.sub]||0;td.textContent=s?yen(s):"—"});
    $("#totY").textContent=yen(total);$("#totW").textContent=won(total*r);$("#perW").textContent=won(total*r/2)}
}
function renderAll(){renderPlan();renderPlaces();renderStay();renderShop();renderBudget();refresh()}

/* ---------- routing ---------- */
const VIEWS=["w","d17","d18","d19","d20","d21","places","stay","shop","budget"];
function route(){const h=(location.hash||"#d17").slice(1);const v=VIEWS.includes(h)?h:"d17";
  VIEWS.forEach(x=>$("#v-"+x).classList.toggle("on",x===v));
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});

/* ---------- events ---------- */
document.addEventListener("input",e=>{const i=e.target;if(i.dataset&&i.dataset.k){const raw=i.value.replace(/[^\d.]/g,"");setV(i.dataset.k,raw===""?null:+raw)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.chk){setV("chk_"+t.dataset.chk,t.checked)}
  if(t.dataset.pick){setV("pick_"+t.dataset.pick,t.value);renderStay();renderPlan();renderBudget();refresh();toast("숙소 선택됨 → 예산 반영")}});
document.addEventListener("click",e=>{
  const mv=e.target.closest("[data-mv]");if(mv){mapView=mv.dataset.mv;selPin=null;renderMap();return}
  const pin=e.target.closest("[data-pin]");if(pin){selPin=pin.dataset.pin;renderMap();return}
  const cp=e.target.closest("[data-copy]");if(cp){navigator.clipboard?.writeText(cp.dataset.copy).then(()=>toast("JAN 복사됨"),()=>toast(cp.dataset.copy));return}
  const dl=e.target.closest("[data-del]");if(dl){if(dl.dataset.armed){delItem(dl.dataset.del)}else{dl.dataset.armed=1;dl.textContent="삭제?";setTimeout(()=>{delete dl.dataset.armed;dl.textContent="×"},2500)}return}
  const go=e.target.closest("[data-go]");if(go){const id=go.dataset.go;setTimeout(()=>{const c=document.getElementById("c-"+id);if(c){c.scrollIntoView({block:"center",behavior:"smooth"});c.animate([{boxShadow:"0 0 0 3px var(--mark)"},{boxShadow:"0 0 0 0 transparent"}],{duration:1600})}},60)}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.pin){e.preventDefault();selPin=e.target.dataset.pin;renderMap()}});
document.addEventListener("submit",e=>{const f=e.target;if(!f.dataset.add)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f));if(!d.name||!d.name.trim())return;
  const o={kind:f.dataset.add,group:f.dataset.group,name:d.name.trim().slice(0,120)};
  if(d.cat)o.cat=d.cat;if(d.memo)o.memo=d.memo.trim().slice(0,200);
  if(d.link&&/^https?:\/\//.test(d.link.trim()))o.link=d.link.trim().slice(0,500);
  const pr=+(String(d.price||"").replace(/[^\d.]/g,""));if(pr)o.price=pr;
  if(o.kind==="place"||o.kind==="stay")o.q=o.name;
  addItem(o);f.reset();toast("추가됨")});

/* ---------- boot ---------- */
loadLocal();renderAll();route();
(async()=>{
  let db=null;try{db=window.claude&&await window.claude.use("db")}catch(e){}
  if(!db){setSync("off","이 기기에만 저장 중");return}
  DB=db;setSync("","불러오는 중…");
  const timer=setTimeout(()=>setSync("off","공유 데이터 연결 지연 중"),10000);
  let first=true,lastSig=null;
  const fail=e=>{clearTimeout(timer);setSync("off",e&&e.code==="revoked"?"연결 끊김":"공유 저장 불가 — 이 기기에만");DB=null};
  DB.collection("vals").onSnapshot(s=>{const nv={};s.docs.forEach(d=>{nv[d.id]=d.data().v});
      Object.keys(pend).forEach(k=>{if(k in VALS)nv[k]=VALS[k]});VALS=nv;
      if(!s.metadata.fromCache){clearTimeout(timer);setSync("on",writable?"언니랑 실시간 공유 중":"보기 전용")}
      const sig=STAYS.map(S=>VALS["pick_"+S.g]||"").join("|");
      if(first){first=false;renderAll()}else if(sig!==lastSig){renderStay();renderPlan();refresh()}else refresh();
      lastSig=sig},fail);
  DB.collection("items").onSnapshot(s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()});ITEMS=n;renderAll()},fail);
})();
</script>
</body>
</html>
